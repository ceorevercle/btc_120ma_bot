name: BTC 120MA Monitor
on:
  schedule:
    - cron: '0 */4 * * *'
    - cron: '5 4 * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: '강제 일일 리포트 보내기'
        required: false
        default: 'false'
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run monitor (4h check)
        if: github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.force_report }}
        run: python btc_monitor.py

      - name: Run daily report (13:05 KST)
        if: github.event.schedule == '5 4 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: 'true'
        run: python btc_monitor.py

      - name: Commit state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "btc-bot"
            git config user.email "bot@github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "update state [skip ci]"
            git push || echo "no push"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id=$TELEGRAM_CHAT_ID -d text="⚠️ BTC 모니터 실패! 깃허브 Actions 로그 확인 필요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
